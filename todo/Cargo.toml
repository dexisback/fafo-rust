[package]
name = "todo"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chobs = "0.1.5"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "derive", "migrate", "tls-rustls", "macros"] }
dotenvy = "0.15"
